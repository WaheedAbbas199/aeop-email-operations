# NOTE: the Postgres path has not been exercised in this build (tests ran on SQLite). Verify before relying on it.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: aeop, POSTGRES_PASSWORD: change-me-locally, POSTGRES_DB: aeop }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U aeop"], interval: 5s, retries: 10 }
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://aeop:change-me-locally@db:5432/aeop
      AEOP_AUTO_CREATE_TABLES: "0"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
volumes: { pgdata: {} }
